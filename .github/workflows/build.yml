name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip files
        run: |
          unzip -o app.zip || true
          unzip -o template.zip || true
          rm -f app.zip template.zip
          ls -la
      - name: Fix setProgress bug
        run: |
          find . -name "*.java" -type f -exec sed -i 's/updateProgressTintList/setProgressTintList/g' {} \;
          find . -name "*.java" -type f -exec sed -i '[STRIPPED 66 bytes]' {} \;
          find . -name "*.java" -type f -exec sed -i 's/private void setProgress/private void updateAppProgress/g' {} \;
          find . -name "*.java" -type f -exec sed -i 's/private void updateProgress/private void updateAppProgress/g' {} \;
          find . -name "*.java" -type f -exec sed -i 's/^[[:space:]]*setProgress(/  updateAppProgress(/g' {} \;
          find . -name "*.java" -type f -exec sed -i 's/^[[:space:]]*updateProgress(/  updateAppProgress(/g' {} \;
          echo "Fixed correctly"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
